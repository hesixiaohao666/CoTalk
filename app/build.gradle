plugins {
    alias(libs.plugins.android.application)
}

def appVersionCode = libs.versions.appVersionCode.get().toInteger()
def appVersionName = libs.versions.appVersionName.get()

android {
    namespace 'com.example.cotalkproject'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId "com.example.cotalkproject"
        minSdk 26
        targetSdk 37
        versionCode appVersionCode
        versionName appVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            manifestPlaceholders = [appName: "CoTalk-开发版"]
        }
        release {
            optimization {
                enable false
            }
            manifestPlaceholders = [appName: "@string/app_name"]
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material
    implementation libs.recyclerview
    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
}